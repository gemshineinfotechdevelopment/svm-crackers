<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="16 10" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#93C5FD" stroke-width="2" stroke-opacity="0.3" />

  <!-- Central Glow -->
  <circle cx="256" cy="230" r="160" fill="url(#sparkleGlow)" />

  <!-- Fireworks Rays -->
  <g stroke="#FDE047" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="70" x2="256" y2="110" />
    <line x1="365" y1="115" x2="335" y2="145" />
    <line x1="420" y1="210" x2="380" y2="215" />
    <line x1="390" y1="320" x2="355" y2="300" />
    <line x1="147" y1="115" x2="177" y2="145" />
    <line x1="92" y1="210" x2="132" y2="215" />
    <line x1="122" y1="320" x2="157" y2="300" />
  </g>

  <!-- Cracker Sparks / Stars -->
  <g fill="#FEF08A">
    <circle cx="256" cy="55" r="7" />
    <circle cx="390" cy="100" r="6" />
    <circle cx="122" cy="100" r="6" />
    <circle cx="445" cy="210" r="6" />
    <circle cx="67" cy="210" r="6" />
    <circle cx="415" cy="345" r="5" />
    <circle cx="97" cy="345" r="5" />
  </g>

  <!-- SVM Text Monogram -->
  <text x="256" y="275"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
        font-weight="900"
        font-size="125"
        letter-spacing="6"
        fill="url(#goldGrad)"
        filter="url(#glow)">
    SVM
  </text>

  <!-- Golden Divider -->
  <line x1="130" y1="305" x2="382" y2="305" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />

  <!-- Subtitle Text -->
  <text x="256" y="345"
        text-anchor="middle"
        font-family="'Inter', -apple-system, sans-serif"
        font-weight="800"
        font-size="28"
        letter-spacing="7"
        fill="#FFFFFF">
    CRACKERS
  </text>

  <!-- Agencies Tagline -->
  <text x="256" y="380"
        text-anchor="middle"
        font-family="'Inter', -apple-system, sans-serif"
        font-weight="600"
        font-size="16"
        letter-spacing="4"
        fill="#93C5FD">
    AGENCIES • SIVAKASI
  </text>
</svg>
